<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before After Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #b8c8d8; overflow: hidden; font: 13px system-ui, sans-serif; }
  #wrap { display: flex; height: 100%; }
  .pane { position: relative; flex: 1; border-left: 2px solid #fff; }
  .pane:first-child { border-left: 0; }
  .label { position: absolute; left: 8px; top: 8px; background: #fffc; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  #info { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #fffc; padding: 4px 8px; border-radius: 4px; }
  @media (max-width: 700px) { #wrap { flex-direction: column; } .pane { border-left: 0; border-top: 2px solid #fff; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap">
  <div class="pane" id="a"><div class="label">before: 航空レーザーの点群</div></div>
  <div class="pane" id="b"><div class="label">after: 写真の色を貼ったモデル（写真に写っていない壁は灰色、屋根は点群の色）</div></div>
</div>
<div id="info">読み込み中…</div>
<script type="module">
// Usage: python3 -m http.server 8123 --bind 127.0.0.1 (repo root), then
// http://127.0.0.1:8123/web/compare.html?a=../out/yasuda_photo/model/yasuda_lidar.glb&b=../out/yasuda_photo/model/yasuda.glb
// Both panes share one camera, so dragging either moves both. pt = point size in metres (default 0.3).
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const q = new URLSearchParams(location.search);
const vec = (s, d) => new THREE.Vector3(...(s ? s.split(",").map(Number) : d));
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 3000);
camera.position.copy(vec(q.get("cam"), [-75, 25, 10]));
const panes = ["a", "b"].map((id) => {
  const el = document.getElementById(id);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(devicePixelRatio);
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xb8c8d8);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x80705a, 2.5));
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(vec(q.get("at"), [0, 15, 0]));
  return { el, renderer, scene, controls };
});
const fit = () => {
  for (const p of panes) p.renderer.setSize(p.el.clientWidth, p.el.clientHeight);
  camera.aspect = panes[0].el.clientWidth / panes[0].el.clientHeight; camera.updateProjectionMatrix();
};
fit(); addEventListener("resize", fit);
for (const p of panes) p.controls.addEventListener("change", () => {
  for (const o of panes) if (o !== p) o.controls.target.copy(p.controls.target);
});

let left = 2;
const files = [q.get("a") || "../out/yasuda_photo/model/yasuda_lidar.glb", q.get("b") || "../out/yasuda_photo/model/yasuda.glb"];
files.forEach((f, i) => new GLTFLoader().load(f, (g) => {
  g.scene.traverse((o) => {
    if (!(o.isMesh || o.isPoints)) return;
    if (o.geometry.attributes.color) o.material.vertexColors = true;
    if (o.isMesh) {   // the colours already hold the light of the photos: draw them as they are
      o.material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
    }
    if (o.isPoints) o.material.size = Number(q.get("pt") || 0.3) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  });
  panes[i].scene.add(g.scene);
  if (--left === 0) document.getElementById("info").textContent = "ドラッグで回転・右ドラッグで移動・ホイールで拡大（左右は連動）";
}, undefined, (e) => { document.getElementById("info").textContent = "読み込み失敗: " + f; }));

const loop = () => { for (const p of panes) { p.controls.update(); p.renderer.render(p.scene, camera); } };
for (const p of panes) p.renderer.setAnimationLoop(null);
panes[0].renderer.setAnimationLoop(loop);
window.panes = panes;
</script>
</body>
</html>
